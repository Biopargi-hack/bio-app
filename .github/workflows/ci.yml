name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify.mjs

  pr-notes:
    name: pr-notes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const required = [
              "## What changed",
              "## Verification",
              "## Not tested",
              "## Handoff",
            ];
            const check = required.map((heading) => {
              const start = body.indexOf(heading);
              if (start < 0) return { heading, ok: false, reason: "missing" };
              const next = required
                .map((other) => body.indexOf(other, start + heading.length))
                .filter((index) => index >= 0)
                .sort((a, b) => a - b)[0] ?? body.length;
              const text = body.slice(start + heading.length, next).trim();
              return {
                heading, ok: text.length > 0,
                reason: text.length ? "" : "empty",
              };
            });
            const bad = check.filter((item) => !item.ok);
            if (bad.length > 0) {
              const details = bad.map((item) => `${item.heading} ${item.reason}`).join(", ");
              core.setFailed(`PR description has ${details}. Fill every section so the next person can continue.`);
            }
