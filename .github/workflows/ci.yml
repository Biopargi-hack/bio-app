name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify.mjs

  pr-notes:
    name: pr-notes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const required = [
              "## What changed",
              "## Verification",
              "## Not tested",
              "## Handoff",
            ];
            const missing = required.filter((heading) => !body.includes(heading));
            if (missing.length > 0) {
              core.setFailed(
                `PR description is missing: ${missing.join(", ")}. ` +
                  "Fill every section of the template so the next person can continue."
              );
            }
