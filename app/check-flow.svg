<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">One line, five checkpoints, one clean check recorded on the phone</title>
  <desc id="flow-desc">A production line with five stations; station three is tapped and the phone saves a clean proof record.</desc>

  <rect x="6" y="6" width="348" height="208" rx="20" fill="#F3F6F7"/>

  <!-- production line -->
  <rect x="18" y="118" width="222" height="10" rx="5" fill="#C7CDD1"/>
  <g font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="middle">
    <rect x="20" y="86" width="40" height="40" rx="10" fill="#FFFFFF" stroke="#C7CDD1" stroke-width="2"/>
    <text x="40" y="111" fill="#2D2E2E">1</text>
    <rect x="64" y="86" width="40" height="40" rx="10" fill="#FFFFFF" stroke="#C7CDD1" stroke-width="2"/>
    <text x="84" y="111" fill="#2D2E2E">2</text>
    <rect x="108" y="86" width="40" height="40" rx="10" fill="#A30029"/>
    <text x="128" y="111" fill="#FFFFFF">3</text>
    <rect x="152" y="86" width="40" height="40" rx="10" fill="#FFFFFF" stroke="#C7CDD1" stroke-width="2"/>
    <text x="172" y="111" fill="#2D2E2E">4</text>
    <rect x="196" y="86" width="40" height="40" rx="10" fill="#FFFFFF" stroke="#C7CDD1" stroke-width="2"/>
    <text x="216" y="111" fill="#2D2E2E">5</text>
  </g>

  <!-- tap pulse on station three -->
  <g fill="none" stroke="#A30029" stroke-width="2" opacity="0.55">
    <circle cx="128" cy="106" r="28"/>
    <circle cx="128" cy="106" r="40" opacity="0.45"/>
  </g>

  <!-- phone with saved proof -->
  <g>
    <rect x="248" y="24" width="96" height="168" rx="20" fill="#2D2E2E"/>
    <rect x="254" y="32" width="84" height="152" rx="14" fill="#FFFFFF"/>
    <rect x="254" y="32" width="84" height="20" rx="14" fill="#A30029"/>
    <rect x="254" y="44" width="84" height="8" fill="#A30029"/>
    <text x="296" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF">TAP TO PROVE</text>
    <circle cx="282" cy="80" r="14" fill="#E7F4EE"/>
    <path d="M276 80l4 4 8-10" fill="none" stroke="#0B7A59" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="296" y="111" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#0B7A59">CLEAN</text>
    <rect x="264" y="124" width="64" height="6" rx="3" fill="#C7CDD1"/>
    <rect x="264" y="136" width="48" height="6" rx="3" fill="#C7CDD1"/>
    <rect x="264" y="152" width="64" height="6" rx="3" fill="#E3E8EA"/>
    <circle cx="268" cy="172" r="3" fill="#A30029"/>
    <rect x="276" y="169" width="44" height="6" rx="3" fill="#E3E8EA"/>
  </g>

  <!-- append-only proof card -->
  <g>
    <rect x="24" y="24" width="158" height="44" rx="12" fill="#FFFFFF"/>
    <rect x="24" y="24" width="158" height="12" rx="12" fill="#A30029"/>
    <rect x="24" y="30" width="158" height="6" fill="#A30029"/>
    <text x="36" y="58" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#0B7A59">+ RECORD 01</text>
    <rect x="118" y="52" width="52" height="6" rx="3" fill="#C7CDD1"/>
  </g>

  <circle cx="332" cy="196" r="4" fill="#E40039" opacity="0.8"/>
</svg>
